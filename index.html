<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monash Exchange Tracker: Public Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e5eff'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 配色和登录页（auth/login.html）同一套：蓝 #1e5eff、灰蓝底、12px 圆角。
     之前表格页是 Monash 蓝 #006dae、白底，登录完一跳进来像换了个网站。 */
  :root {
    --bg:#f4f6fb; --card:#ffffff; --panel:#ffffff; --fg:#141a2b; --muted:#5d6680;
    --line:#dde2ee; --field:#f8f9fd; --chip:#eef1f7;
    --accent:#1e5eff; --accent-hover:#164ad1; --accent-soft:rgba(30,94,255,.12);
    --green:#148a4b; --yellow:#a86800; --red:#c62f3b; --closed:#6b7284;
    --shadow:0 1px 2px rgba(20,26,43,.04), 0 8px 24px rgba(20,26,43,.06);
    --radius:12px; --topbar:56px;
  }
  /* 深色：跟系统走，右上角也能手动切（存在 localStorage 的 theme 里，登录页读同一个键） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d111b; --card:#151b29; --panel:#151b29; --fg:#e8ecf6; --muted:#97a1ba;
      --line:#273049; --field:#10151f; --chip:#1c2335;
      --accent:#5b8bff; --accent-hover:#7aa1ff; --accent-soft:rgba(91,139,255,.18);
      --green:#4ccf7f; --yellow:#e6b94a; --red:#ff7a85; --closed:#9aa3b8;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d111b; --card:#151b29; --panel:#151b29; --fg:#e8ecf6; --muted:#97a1ba;
    --line:#273049; --field:#10151f; --chip:#1c2335;
    --accent:#5b8bff; --accent-hover:#7aa1ff; --accent-soft:rgba(91,139,255,.18);
    --green:#4ccf7f; --yellow:#e6b94a; --red:#ff7a85; --closed:#9aa3b8;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:calc(var(--topbar) + 1rem); }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
         -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .page { max-width:1600px; margin:0 auto; padding:1rem 1.25rem 2rem; }

  /* ── 顶栏 ────────────────────────────────────────────────────────────
     标题、更新时间、语言、主题、退出都收在一条 56px 的栏里并吸顶。
     之前标题和五个统计格挤在同一行，窗口一窄就折成三层。 */
  .topbar { position:sticky; top:0; z-index:30; height:var(--topbar);
            background:color-mix(in srgb, var(--card) 88%, transparent);
            backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
            border-bottom:1px solid var(--line); }
  .topbar-in { max-width:1600px; margin:0 auto; height:100%; padding:0 1.25rem;
               display:flex; align-items:center; gap:1rem; }
  .brand { display:flex; align-items:center; gap:.65rem; min-width:0; color:var(--fg); }
  .brand:hover { text-decoration:none; }
  .brand .mark { flex:none; width:32px; height:32px; border-radius:9px; display:grid; place-items:center;
                 background:linear-gradient(150deg, #0f2a6b, #1e5eff); color:#fff;
                 box-shadow:0 2px 6px rgba(30,94,255,.3); }
  .brand .name { display:block; font-weight:700; letter-spacing:-.01em; line-height:1.2; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:430px) { .brand .long { display:none; } }
  .brand .meta { display:block; font-size:.74rem; color:var(--muted); line-height:1.3;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand .meta b { color:var(--fg); font-weight:600; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:.45rem; flex:none; }
  /* 语言切换：两个并排、当前高亮，和登录页一样的做法 */
  .seg { display:inline-flex; padding:3px; border:1px solid var(--line); border-radius:9px; background:var(--card); }
  .seg button { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:.76rem;
                padding:.22rem .55rem; border-radius:6px; line-height:1.4; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:600; }
  .seg button:hover:not([aria-pressed="true"]) { color:var(--accent); }
  .icon-btn { display:inline-grid; place-items:center; width:32px; height:32px; border:1px solid var(--line);
              border-radius:9px; background:var(--card); color:var(--muted); cursor:pointer; padding:0; }
  .icon-btn:hover { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .icon-btn svg { width:16px; height:16px; }
  #theme .moon { display:none; }
  :root[data-theme="dark"] #theme .sun { display:none; }
  :root[data-theme="dark"] #theme .moon { display:block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #theme .sun { display:none; }
    :root:not([data-theme="light"]) #theme .moon { display:block; }
  }
  #logout { display:inline-flex; align-items:center; gap:.35rem; height:32px; padding:0 .65rem;
            border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--muted);
            font-size:.78rem; white-space:nowrap; }
  #logout:hover { color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, var(--line)); text-decoration:none; }
  @media (max-width:760px) {
    .topbar-in { padding:0 .9rem; gap:.6rem; }
    .brand .meta { display:none; }
    #logout span { display:none; }
    #logout { width:32px; padding:0; justify-content:center; }
  }

  /* 抓取被拦或机器没开时，数据会停在旧的一天。与其让人自己比对日期，
     不如页面直接说出来。 */
  #stale { display:none; margin:0 0 1rem; padding:.6rem .85rem; border-radius:10px;
           background:color-mix(in srgb, var(--red) 10%, var(--card)); color:var(--red);
           border:1px solid color-mix(in srgb, var(--red) 35%, var(--line)); font-size:.88rem; }

  /* ── 总览：五个可点的统计格 ──────────────────────────────────────────
     数的是**当前筛选结果**。点绿灯/黄灯/红灯/已关闭等于在左边勾那一项，
     少走一趟侧栏。「筛选结果」那一格不能点。 */
  .overview { display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 1rem; }
  .stat { --tone:var(--fg); display:inline-flex; align-items:baseline; gap:.45rem; padding:.4rem .8rem;
          border:1px solid var(--line); border-radius:999px; background:var(--card); cursor:pointer;
          box-shadow:0 1px 2px rgba(20,26,43,.04); transition:border-color .12s, box-shadow .12s; }
  .stat .dot { align-self:center; width:8px; height:8px; border-radius:50%; background:var(--tone); }
  .stat .v { font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; }
  .stat .k { font-size:.78rem; color:var(--muted); white-space:nowrap; }
  .stat.g { --tone:var(--green); } .stat.y { --tone:var(--yellow); }
  .stat.r { --tone:var(--red); }   .stat.c { --tone:var(--closed); }
  .stat.total { cursor:default; }
  .stat.total .v { color:var(--accent); }
  .stat:not(.total):hover { border-color:var(--tone); }
  .stat[aria-pressed="true"] { border-color:var(--tone);
                               box-shadow:0 0 0 2px color-mix(in srgb, var(--tone) 25%, transparent);
                               background:color-mix(in srgb, var(--tone) 8%, var(--card)); }
  .stat[aria-pressed="true"] .k { color:var(--tone); }
  @media (max-width:600px) {
    .overview { gap:.35rem; }
    .stat { padding:.3rem .6rem; gap:.35rem; } .stat .v { font-size:.95rem; } .stat .k { font-size:.72rem; }
  }

  /* ── 变化汇总 ────────────────────────────────────────────────────────
     表格里的「变化」列是逐行看的，这里先回答「整体动了多少、最近动了什么」，
     再一键把表格筛到那几所。格子压成两行各 56px，之前一屏高、表格被推到第二屏。 */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  #changePanel { margin:0 0 1rem; padding:0; }
  #changePanel > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:.6rem;
                      padding:.7rem 1rem; font-weight:600; font-size:.92rem; }
  #changePanel > summary::-webkit-details-marker { display:none; }
  #changePanel > summary > span:first-child { white-space:nowrap; flex:none; }
  #changePanel > summary .hint { font-weight:400; font-size:.8rem; color:var(--muted); min-width:0;
                            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #changePanel > summary .hint b { color:var(--accent); font-weight:600; }
  #changePanel > summary .chev { margin-left:auto; flex:none; color:var(--muted); transition:transform .15s; }
  #changePanel[open] > summary .chev { transform:rotate(180deg); }
  #changePanel[open] > summary { border-bottom:1px solid var(--line); }
  .digest-body { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:1.25rem; padding:.85rem 1rem 1rem; }
  @media (max-width:900px) { .digest-body { grid-template-columns:minmax(0,1fr); gap:1rem; } }
  .digest-body h3 { margin:0 0 .55rem; font-size:.76rem; font-weight:600; color:var(--muted); letter-spacing:.01em; }
  /* 左半边：行首一个小标签说这一行是「利好」还是「更难」，格子本身就不用再
     每个都写一遍 "in your favour"。同一列上下对照，一眼看出这一项整体是松了还是紧了。 */
  .tiles { display:grid; grid-template-columns:3.6rem repeat(5, minmax(0,1fr)); gap:.4rem; align-items:stretch; }
  .rowlab { --tone:var(--muted); display:flex; align-items:center; font-size:.7rem; font-weight:600; color:var(--tone);
            padding-left:.1rem; }
  .rowlab.good { --tone:var(--green); } .rowlab.bad { --tone:var(--red); }
  .tile { --tone:var(--muted); text-align:left; cursor:pointer; padding:.45rem .6rem; border-radius:10px;
          display:flex; align-items:center; gap:.55rem; min-height:54px; color:var(--fg);
          border:1px solid color-mix(in srgb, var(--tone) 22%, var(--line));
          background:color-mix(in srgb, var(--tone) 6%, var(--card));
          transition:border-color .12s, box-shadow .12s, transform .12s; }
  .tile.good { --tone:var(--green); } .tile.bad { --tone:var(--red); }
  .tile.neutral { --tone:var(--yellow); } .tile.new { --tone:var(--accent); }
  .tile .v { font-size:1.35rem; font-weight:700; line-height:1; color:var(--tone); font-variant-numeric:tabular-nums; min-width:1.4ch; }
  .tile .t { display:flex; flex-direction:column; min-width:0; }
  .tile .k { font-size:.76rem; font-weight:600; color:var(--fg); white-space:nowrap; line-height:1.25; }
  .tile .s { font-size:.66rem; color:var(--muted); white-space:nowrap; line-height:1.2; }
  .tile .s:empty { display:none; }
  .tile:hover:not(:disabled) { border-color:var(--tone); transform:translateY(-1px); }
  .tile[aria-pressed="true"] { border-color:var(--tone);
                               box-shadow:0 0 0 2px color-mix(in srgb, var(--tone) 28%, transparent);
                               background:color-mix(in srgb, var(--tone) 14%, var(--card)); }
  /* 0 的格子留着占位（两行五列的对照要完整），只是退成灰色、不能点 */
  .tile:disabled { cursor:default; --tone:var(--muted); opacity:.5; }
  @media (max-width:600px) {
    .tiles { grid-template-columns:repeat(5, minmax(0,1fr)); gap:.3rem; }
    .rowlab { grid-column:1 / -1; padding:.1rem 0 0; }
    .tile { flex-direction:column; align-items:flex-start; gap:.15rem; padding:.4rem .45rem; min-height:0; }
    .tile .v { font-size:1.1rem; }
    .tile .k { font-size:.66rem; white-space:normal; word-break:keep-all; }
    .tile .s { display:none; }
  }
  .digest-note { margin:.5rem 0 0; font-size:.76rem; color:var(--muted); }
  .digest-note:empty { display:none; }
  .digest-note button { color:var(--accent); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; }
  /* 右半边：逐日记录，日期靠左成一条时间轴 */
  #feed { list-style:none; margin:0; padding:0; font-size:.8rem; }
  #feed.expanded { max-height:16rem; overflow-y:auto; padding-right:.3rem; }
  #feed li { display:grid; grid-template-columns:3.2rem minmax(0,1fr); gap:.5rem; align-items:baseline;
               padding:.38rem 0; border-bottom:1px dashed var(--line); }
  #feed li:last-child { border-bottom:0; }
  #feed time { color:var(--muted); font-variant-numeric:tabular-nums; font-size:.74rem; }
  #feed .what { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #feed .uni { font-weight:600; color:var(--accent); background:none; border:0; padding:0; cursor:pointer; }
  #feed .uni:hover { text-decoration:underline; }
  #feed .field { color:var(--muted); margin:0 .3rem; }
  #feed .old { color:var(--muted); text-decoration:line-through; }
  #feed .to.good { color:var(--green); font-weight:600; }
  #feed .to.bad { color:var(--red); font-weight:600; }
  #feed .to.neutral { font-weight:600; }
  #feed .tag { display:inline-block; font-size:.68rem; font-weight:600; padding:0 .35rem; border-radius:5px;
                 color:var(--accent); background:var(--accent-soft); margin-left:.3rem; }
  #feed li.recent-empty { display:block; border:0; padding:0; color:var(--muted); }

  /* ── 主体：左筛选、右表格 ───────────────────────────────────────────── */
  .layout { display:grid; grid-template-columns:236px minmax(0,1fr); gap:1rem; align-items:start; }
  /* minmax(0,…) 不能省：裸 1fr 的下限是内容的最小宽度，而这张表最小也要
     1100px，于是窄屏上整个版面被撑出屏幕。写成 minmax(0,1fr) 才允许这一列
     缩下去，把横向滚动关回表格自己的 .wrap 里。 */
  @media (max-width:1400px) and (min-width:901px) {
    .layout { grid-template-columns:208px minmax(0,1fr); gap:.85rem; }
  }
  aside { position:sticky; top:calc(var(--topbar) + 1rem); max-height:calc(100vh - var(--topbar) - 2rem);
          overflow-y:auto; overscroll-behavior:contain; }
  .side-head { display:flex; justify-content:space-between; align-items:center; padding:.75rem .9rem;
               border-bottom:1px solid var(--line); font-weight:600; font-size:.92rem; }
  .side-close { display:none; }
  #clearFilters { font-size:.76rem; padding:.2rem .55rem; cursor:pointer; border:1px solid var(--line);
           border-radius:7px; background:var(--card); color:var(--accent); }
  #clearFilters:hover { border-color:var(--accent); }
  .search { position:relative; padding:.7rem .9rem; border-bottom:1px solid var(--line); }
  .search svg { position:absolute; left:1.45rem; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); pointer-events:none; }
  #q { width:100%; padding:.5rem .6rem .5rem 1.9rem; font-size:.86rem; border:1px solid var(--line);
       border-radius:8px; background:var(--field); color:var(--fg); }
  #q:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #facets details { padding:0 .9rem; border-bottom:1px solid var(--line); }
  #facets details:last-child { border-bottom:0; }
  summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:.4rem;
            padding:.6rem 0; font-size:.84rem; font-weight:600; color:var(--fg); }
  summary::-webkit-details-marker { display:none; }
  #facets summary::after { content:""; width:7px; height:7px; border-right:1.5px solid var(--muted);
                           border-bottom:1.5px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; flex:none; }
  #facets details[open] summary::after { transform:rotate(45deg); }
  .opts { margin:0 0 .6rem; display:flex; flex-direction:column; gap:.2rem; }
  .opt { display:flex; gap:.5rem; align-items:flex-start; font-size:.82rem; cursor:pointer;
         padding:.15rem .3rem; margin:0 -.3rem; border-radius:6px; }
  .opt:hover { background:var(--chip); }
  .opt input { margin:.25rem 0 0; flex:none; accent-color:var(--accent); }
  .opt .n { color:var(--muted); font-size:.74rem; margin-left:auto; padding-left:.3rem; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; background:var(--accent); color:#fff; border-radius:10px; padding:0 .4rem;
           font-size:.68rem; margin-left:.4rem; line-height:1.5; }
  .badge[hidden] { display:none; }

  /* 手机：侧栏变成从左边滑出来的抽屉，底部一个「筛选」按钮打开。
     之前侧栏整个排在表格上面，打开页面第一屏全是筛选项，表格在第二屏。 */
  .backdrop { display:none; position:fixed; inset:0; z-index:40; background:rgba(10,14,25,.45); }
  .fab { display:none; position:fixed; left:50%; bottom:1rem; transform:translateX(-50%); z-index:35;
         align-items:center; gap:.45rem; padding:.6rem 1.1rem; border:0; border-radius:999px;
         background:var(--accent); color:#fff; font-weight:600; font-size:.88rem; cursor:pointer;
         box-shadow:0 8px 24px rgba(30,94,255,.35); }
  .fab .badge { background:#fff; color:var(--accent); margin-left:.1rem; }
  @media (max-width:900px) {
    .layout { grid-template-columns:minmax(0,1fr); }
    aside { position:fixed; top:0; left:0; bottom:0; width:min(86vw, 340px); max-height:none; z-index:45;
            border-radius:0; border-width:0 1px 0 0; transform:translateX(-102%); transition:transform .2s ease; }
    body.filters-open aside { transform:none; }
    body.filters-open .backdrop { display:block; }
    body.filters-open { overflow:hidden; }
    .side-close { display:inline-grid; }
    .fab { display:inline-flex; }
    .page { padding-bottom:4.5rem; }
  }

  /* 表格上方：当前生效的筛选条件一排可删的标签，右边是行数和密度 */
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin:0 0 .6rem; min-height:32px; }
  .active { display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; min-width:0; }
  .active:empty { display:none; }
  .fchip { display:inline-flex; align-items:center; gap:.3rem; padding:.18rem .3rem .18rem .6rem; border-radius:999px;
           background:var(--accent-soft); color:var(--accent); font-size:.76rem; font-weight:600; max-width:100%; }
  .fchip i { font-style:normal; font-weight:400; color:var(--muted); }
  .fchip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fchip button { border:0; background:transparent; color:inherit; cursor:pointer; width:18px; height:18px;
                  border-radius:50%; display:grid; place-items:center; padding:0; line-height:1; }
  .fchip button:hover { background:var(--accent); color:#fff; }
  .toolbar-right { margin-left:auto; display:flex; align-items:center; gap:.6rem; font-size:.8rem; color:var(--muted); white-space:nowrap; }
  .toolbar-right b { color:var(--fg); font-weight:600; }
  #density button svg { width:14px; height:14px; display:block; }
  @media (max-width:760px) { #density { display:none; } }

  /* ── 表格 ────────────────────────────────────────────────────────────
     文字列左对齐、数字列右对齐、状态色块居中。之前全列居中，校名长短不一，
     一眼扫不出一列的起点。 */
  .table-card { overflow:hidden; }
  .wrap { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:.84rem; }
  /* 横向内边距要克制：12 列 × 两侧，每边多 2px 就是全表多 48px，
     而这张表的宽度预算正好卡在「更新时间那一列露不露得出来」上。 */
  th, td { padding:.55rem .45rem; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  /* 表头可以折行：英文标签比中文长，nowrap 会让最长的那个语言把列撑开。
     word-break:keep-all 禁止 CJK 字间断行，英文仍按空格正常折。 */
  th { position:sticky; top:0; z-index:2; background:var(--card); cursor:pointer; user-select:none;
       font-size:.74rem; font-weight:600; color:var(--muted);
       white-space:normal; line-height:1.25; word-break:keep-all; }
  th:hover { color:var(--fg); }
  th.sorted { color:var(--accent); }
  th.sorted::after { content:" ↓"; }
  th.sorted.asc::after { content:" ↑"; }
  th.num, td.num { text-align:right; }
  th.mid, td.mid { text-align:center; }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  tbody tr { transition:background .1s; }
  tbody tr:hover { background:color-mix(in srgb, var(--accent) 5%, var(--card)); }
  tbody tr:last-child td { border-bottom:0; }
  /* 密度：舒适 / 紧凑，记在 localStorage */
  body[data-density="compact"] td { padding-top:.32rem; padding-bottom:.32rem; }
  body[data-density="compact"] table { font-size:.8rem; }

  /* 学校名固定在左边：横向滚动时不至于看着一行数字却不知道是哪所学校 */
  th.stick, td.stick { position:sticky; left:0; z-index:1; background:var(--card); min-width:168px; max-width:205px; }
  th.stick { z-index:3; }
  tbody tr:hover td.stick { background:color-mix(in srgb, var(--accent) 5%, var(--card)); }
  /* 吸附列右侧的投影用 ::before：::after 要留给排序箭头 */
  td.stick::before, th.stick::before { content:""; position:absolute; top:0; right:0; bottom:0; width:6px;
                                       transform:translateX(100%); pointer-events:none;
                                       background:linear-gradient(90deg, rgba(0,0,0,.05), transparent); }
  td.stick a { color:var(--fg); font-weight:500; }
  td.stick a:hover { color:var(--accent); }
  /* 数值后面的单位（WAM / GPA）每行都一样，压暗让数字先被看见 */
  .unit { color:var(--muted); font-size:.88em; font-weight:400; margin-left:.15em; }
  td.small { font-size:.78rem; color:var(--muted); }
  td.tight, th.tight { min-width:0; width:1%; white-space:nowrap; }
  td.clip { max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dim { color:var(--muted); }

  /* 状态与竞争用色块而不是彩色文字：一屏 164 行，色块能扫，文字不能。
     两者不合并——有项目状态 Closed 而竞争 Red，合并会抹掉这个差别。 */
  .pill { --tone:var(--closed); display:inline-flex; align-items:center; gap:.32rem; padding:.08rem .5rem .08rem .4rem;
          border-radius:999px; font-size:.72rem; font-weight:600; white-space:nowrap; color:var(--tone);
          background:color-mix(in srgb, var(--tone) 11%, transparent);
          border:1px solid color-mix(in srgb, var(--tone) 28%, transparent); }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--tone); flex:none; }
  .pill.Open, .pill.av-Green { --tone:var(--green); }
  .pill.av-Yellow { --tone:var(--yellow); }
  .pill.av-Red { --tone:var(--red); }
  .pill.Closed, .pill.av-Closed { --tone:var(--closed); }

  /* 分数之外的硬门槛：语言能力、学分前提、仅限邀请。用琥珀色而不是 ⚠ 的红——
     ⚠ 说的是「数据自相矛盾」，这里说的是「你得先满足这个」。 */
  .cond { margin-left:.12rem; font-size:.8rem; font-weight:800; cursor:help; color:var(--yellow); }

  /* 变化列。颜色按「对你是好是坏」而不是按箭头方向：名额↑ 是好事，分数线↑ 是坏事。 */
  .chg { --tone:var(--muted); display:inline-block; padding:.04rem .3rem; border-radius:6px; font-size:.7rem;
         font-weight:600; white-space:nowrap; color:var(--tone);
         background:color-mix(in srgb, var(--tone) 11%, transparent);
         border:1px solid color-mix(in srgb, var(--tone) 28%, transparent); }
  .chg + .chg { margin-left:.2rem; }
  .chg.bad { --tone:var(--red); } .chg.good { --tone:var(--green); }
  .chg.neutral { --tone:var(--yellow); } .chg.new { --tone:var(--accent); }
  th[data-key="change_rank"], td.chg-cell { min-width:118px; }
  td.chg-cell { max-width:136px; white-space:normal; line-height:1.7; }
  /* 窗口不够宽时先从内边距和我自己设的下限要地方，而不是藏掉某一列：
     状态和竞争看着重复，但有项目状态已关闭而竞争仍是红灯，藏掉就成了错的信息 */
  @media (max-width:1400px) {
    th, td { padding:.5rem .32rem; }
    th.stick, td.stick { min-width:150px; max-width:190px; }
    th[data-key="change_rank"], td.chg-cell { min-width:96px; }
    td.chg-cell { max-width:110px; }
    td.clip { max-width:88px; }
  }
  .warn { color:var(--red); cursor:help; }
  .only-one { color:var(--yellow); }
  /* QS 单元格。原生 title 要悬停一两秒才出、窄格子里也塞不下多行，所以用跟随鼠标的浮层。 */
  .chip { display:inline-block; padding:0 .3rem; border-radius:6px; font-size:.72rem; line-height:1.5;
          white-space:nowrap; cursor:help; }
  .chip-subject { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .chip-none { color:var(--muted); }
  .qs-rank { cursor:help; border-bottom:1px dotted var(--muted); font-variant-numeric:tabular-nums; }
  #tip { position:fixed; z-index:60; max-width:340px; padding:.5rem .65rem; border-radius:8px;
         background:var(--fg); color:var(--bg); font-size:.78rem; line-height:1.45;
         box-shadow:0 6px 20px rgba(0,0,0,.25); pointer-events:none; display:none; }
  #tip b { color:var(--bg); }
  #tip i { opacity:.72; font-style:normal; }
  .empty { padding:3rem 1rem; text-align:center; color:var(--muted); }
  .empty svg { width:40px; height:40px; color:var(--line); display:block; margin:0 auto .6rem; }
  .empty[hidden] { display:none; }

  /* 手机：表格换成卡片。12 列横向滚动在 390px 宽的屏上一次只看得到两列，
     而真正要比的就那几项：状态、竞争、分数线、名额、变化。 */
  #cards { display:none; }
  @media (max-width:760px) {
    .wrap { display:none; }
    .table-card { background:transparent; border:0; box-shadow:none; overflow:visible; }
    #cards { display:grid; gap:.6rem; }
    .empty { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); }
  }
  .pcard { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:.75rem .85rem; }
  .pcard-head { display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem; }
  .pcard .name { font-weight:600; line-height:1.3; }
  .pcard .name a { color:var(--fg); }
  .pcard .sub { color:var(--muted); font-size:.76rem; margin-top:.1rem; }
  .pcard .qs { flex:none; text-align:right; font-size:.76rem; color:var(--muted); }
  .pcard .qs b { display:block; font-size:1rem; color:var(--fg); font-variant-numeric:tabular-nums; }
  .pcard .pills { display:flex; flex-wrap:wrap; gap:.35rem; margin:.5rem 0; }
  .pcard .facts { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.4rem .6rem; font-size:.82rem; }
  .pcard .facts b { display:block; font-size:.64rem; font-weight:500; color:var(--muted); letter-spacing:.03em; text-transform:uppercase; }
  .pcard .facts .num { font-variant-numeric:tabular-nums; }
  .pcard .chg-line { margin-top:.5rem; line-height:1.8; }
  .pcard .chg-line:empty { display:none; }

  footer { margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--line); color:var(--muted); font-size:.78rem;
           display:flex; flex-wrap:wrap; gap:.4rem 1.5rem; justify-content:space-between; }

  /* ── 仅 demo 有的东西 ── */
  .banner { margin:0 0 1rem; padding:.6rem .85rem; border-radius:10px; font-size:.84rem;
            background:color-mix(in srgb, var(--yellow) 10%, var(--card)); color:var(--yellow);
            border:1px solid color-mix(in srgb, var(--yellow) 35%, var(--line)); }

    tCutDown:"分数线↓", tPlacesUp:"名额↑", tCompDown:"竞争↓", tOpened:"转开放", tNew:"新增",
    tCutUp:"分数线↑", tPlacesDown:"名额↓", tCompUp:"竞争↑", tClosed:"转关闭", tCutScale:"分数线~", tCutScaleSub:"WAM ⇄ GPA",
    tNewSub:"上一轮没有", rowGood:"利好", rowBad:"更难", densityComfy:"宽松行距", densityCompact:"紧凑行距",
    theme:"浅色 / 深色", fchipSearch:"搜索", fchipTile:"变动", removeFilter:"去掉这个条件",
    cardMin:"最低要求", cardCutoff:"上轮分数线", cardPlaces:"名额",
    feedMore:n=>`展开全部（${n}）`, feedLess:"收起", feedEmpty:"当前筛选下没有变化。",
    evAdded:"新上线", fOpen:"状态", fAvail:"竞争", fPlaces:"名额", fCutoff:"分数线",
    feedSearch:"在表格中搜索这所学校"
  }
};

const FACETS=[
  {key:"region",labelKey:"facetRegion",open:true},
  {key:"semester_availability",labelKey:"facetTerms",open:true},
  {key:"program_duration",labelKey:"facetDuration"},
  {key:"search_eligible_campus",labelKey:"facetCampus"},
  {key:"search_eligible_faculties",labelKey:"facetFaculties",open:true},
  {key:"open_closed",labelKey:"facetStatus"},
  {key:"exchange_availability",labelKey:"facetAvailability"}
];

const AVAIL_RANK={Green:0,Yellow:1,Red:2,Closed:3};

function t(key){return I18N[lang][key] ?? key;}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function asList(v){if(Array.isArray(v))return v.filter(Boolean);if(v===null||v===undefined||v==="")return[];return[String(v)];}
function selectedValues(key){return [...document.querySelectorAll(`input[data-facet="${key}"]:checked`)].map(el=>el.value);}

function translatedValue(key,value){
  if(key==="open_closed") return value==="Open"?t("open"):value==="Closed"?t("statusClosed"):value;
  if(key==="exchange_availability") return t(value);
  return value;
}

function statusText(value){return value==="Open"?t("open"):value==="Closed"?t("statusClosed"):value||"—";}
function availabilityText(value){return value?t(value):"—";}

function captureSelections(){
  const out={};
  for(const f of FACETS) out[f.key]=selectedValues(f.key);
  return out;
}

function buildFacets(saved={}){
  const host=document.getElementById("facetHost");
  host.innerHTML="";
  for(const facet of FACETS){
    const allValues=[...new Set(programs.flatMap(p=>asList(p[facet.key])))].sort((a,b)=>a.localeCompare(b));
    const details=document.createElement("details");
    details.open=!!facet.open;
    const summary=document.createElement("summary");
    summary.innerHTML=`<span>${esc(t(facet.labelKey))}<span class="badge" data-count="${facet.key}" hidden></span></span>`;
    details.appendChild(summary);
    const options=document.createElement("div");
    options.className="opts";
    allValues.forEach(value=>{
      const label=document.createElement("label");
      label.className="opt";
      label.dataset.facetOption=facet.key;
      label.dataset.value=value;
      const input=document.createElement("input");
      input.type="checkbox";
      input.value=value;
      input.dataset.facet=facet.key;
      input.checked=(saved[facet.key]||[]).includes(value);
      input.addEventListener("change",render);
      const text=document.createElement("span");
      text.textContent=translatedValue(facet.key,value);
      const n=document.createElement("span");
      n.className="n";
      n.textContent="0";
      label.append(input,text,n);
      options.appendChild(label);
    });
    details.appendChild(options);
    host.appendChild(details);
  }
}

function matchesProgram(p,excludeFacet=null,ignoreTile=false){
  const q=document.getElementById("q").value.trim().toLowerCase();
  if(q){
    const haystack=`${p.university||""} ${p.country||""}`.toLowerCase();
    if(!haystack.includes(q)) return false;
  }
  for(const facet of FACETS){
    if(facet.key===excludeFacet) continue;
    const selected=selectedValues(facet.key);
    if(!selected.length) continue;
    const values=asList(p[facet.key]);
    if(!selected.some(v=>values.includes(v))) return false;
  }
  if(!ignoreTile&&activeTile&&!categories(p).has(activeTile)) return false;
  return true;
}

function updateFacetCounts(){
  for(const facet of FACETS){
    const pool=programs.filter(p=>matchesProgram(p,facet.key));
    const counts=new Map();
    for(const p of pool) for(const value of asList(p[facet.key])) counts.set(value,(counts.get(value)||0)+1);
    const badge=document.querySelector(`[data-count="${facet.key}"]`);
    const chosen=selectedValues(facet.key).length;
    if(badge){badge.hidden=chosen===0;badge.textContent=chosen;}
    document.querySelectorAll(`.opt[data-facet-option="${facet.key}"]`).forEach(label=>{
      const value=label.dataset.value;
      const count=counts.get(value)||0;
      const input=label.querySelector("input");
      label.querySelector(".n").textContent=count;
      input.disabled=count===0&&!input.checked;
      label.classList.toggle("unavailable",input.disabled);
    });
  }
}

function sortValue(p,key){
  if(key==="change_sort") return String(changeChips(p).length);
  if(key==="qs") return String(qsSort(p)).padStart(6,"0");
  const value=p[key];
  return Array.isArray(value)?value.join(" | "):String(value??"");
}

function changeChips(p){
  const b=baselineByUniversity[p.university];
  if(!b) return baselineLoaded?[{key:"chgNew",tone:"neutral",arrow:"",from:"",to:""}]:[];
  if(b.new) return [{key:"chgNew",tone:"neutral",arrow:"",from:"",to:""}];
  const chips=[];
  const a0=b.exchange_availability, a1=p.exchange_availability;
  if(a0&&a1&&a0!==a1){
    const harder=(AVAIL_RANK[a1]??9)>(AVAIL_RANK[a0]??9);
    chips.push({key:"chgAvail",arrow:harder?"↑":"↓",tone:harder?"bad":"good",from:a0,to:a1,type:"availability"});
  }
  const n0=b.anticipated_places_max, n1=p.anticipated_places_max;
  if(n0!=null&&n1!=null&&n0!==n1){
    const more=n1>n0;
    chips.push({key:"chgPlaces",arrow:more?"↑":"↓",tone:more?"good":"bad",from:b.anticipated_places??n0,to:p.anticipated_places??n1});
  }
  const c0=b.previous_round_cutoff_value, c1=p.previous_round_cutoff_value;
  if(c0!=null&&c1!=null&&(c0!==c1||b.previous_round_cutoff_scale!==p.previous_round_cutoff_scale)){
    const comparable=b.previous_round_cutoff_scale===p.previous_round_cutoff_scale;
    if(comparable){
      const higher=c1>c0;
      chips.push({key:"chgCutoff",arrow:higher?"↑":"↓",tone:higher?"bad":"good",from:b.previous_round_cutoff,to:p.previous_round_cutoff});
    }else{
      chips.push({key:"chgCutoff",arrow:"~",tone:"neutral",from:b.previous_round_cutoff,to:p.previous_round_cutoff});
    }
  }
  const s0=b.open_closed, s1=p.open_closed;
  if(s0&&s1&&s0!==s1){
    const closed=s1==="Closed";
    chips.push({key:closed?"chgClosed":"chgOpened",arrow:"",tone:closed?"bad":"good",from:s0,to:s1,type:"status"});
  }
  return chips;
}

function categories(p){
  const cats=new Set();
  const chips=changeChips(p);
  for(const c of chips){
    if(c.key==="chgNew") cats.add("new");
    else if(c.key==="chgCutoff"){ if(c.tone==="good") cats.add("cutDown"); else if(c.tone==="bad") cats.add("cutUp"); else cats.add("cutScale"); }
    else if(c.key==="chgPlaces") cats.add(c.tone==="good"?"placesUp":"placesDown");
    else if(c.key==="chgAvail") cats.add(c.tone==="good"?"compDown":"compUp");
    else if(c.key==="chgOpened") cats.add("opened");
    else if(c.key==="chgClosed") cats.add("closed");
  }
  if(chips.length) cats.add("any");   // 不是格子，给汇总那句「n 个有变化」用
  return cats;
}

function fmtRank(r){r=String(r??"");return r.includes("-")?r.replace("-","–"):"#"+r;}
function qsSort(p){const q=p.qs||{};return q.sort??99999;}

function renderQs(p){
  const q=p.qs||{};
  if(!q.source||q.source==="none") return `<span class="qs none" data-tip="${esc(t("qsNoneTip"))}">${esc(t("qsNone"))}</span>`;
  if(q.source==="subject_2026"){
    const subs=q.subjects||[];
    const name=s=>lang==="zh"?(s.subject_zh||s.subject):s.subject;
    const best=subs[0];
    const tip=`${t("qsSubjectTip")}\n${subs.map(s=>`${name(s)} ${fmtRank(s.rank)}`).join("\n")}`;
    return `<span class="qs subject" data-tip="${esc(tip)}">${esc(name(best))} ${esc(fmtRank(best.rank))}</span>`;
  }
  const fallback=q.source==="overall_2026";
  const tag=fallback?`<span class="tag">${esc(t("qs2026"))}</span>`:"";
  return `<span class="qs" data-tip="${esc(t(fallback?"qsOverall2026":"qsOverall2027"))}">${esc(fmtRank(q.rank))}${tag}</span>`;
}

function fieldLabel(f){return {open_closed:t("fOpen"),exchange_availability:t("fAvail"),anticipated_places:t("fPlaces"),previous_round_cutoff:t("fCutoff")}[f]||f;}
function fieldValue(f,v){if(f==="open_closed") return statusText(v); if(f==="exchange_availability") return availabilityText(v); return v??"—";}

function renderPanel(){
  const pool=programs.filter(p=>matchesProgram(p,null,true));
  const counts={};
  for(const tile of TILES) counts[tile.id]=0;
  counts.any=0;
  for(const p of pool) for(const c of categories(p)) if(c in counts) counts[c]++;
  document.getElementById("panelTitle").textContent=t("panelTitle");
  document.getElementById("panelSub").textContent=I18N[lang].panelSub(counts.any,pool.length);
  document.getElementById("tilesTitle").textContent=t("tilesTitle");
  document.getElementById("feedTitle").textContent=t("feedTitle");
  document.getElementById("tileHint").textContent=activeTile?t("tileActive"):t("tileHint");
  const clearBtn=document.getElementById("clearTile");
  clearBtn.textContent=t("clear");
  clearBtn.style.visibility=activeTile?"visible":"hidden";
  const host=document.getElementById("tiles");
  host.innerHTML="";
  // 行首标签说这一行是利好还是更难，格子本身就只剩数字和名目
  TILES.forEach((tile,i)=>{
    if(i===0||i===5){
      const lab=document.createElement("span");
      lab.className=`rowlab ${i===0?"good":"bad"}`;
      lab.textContent=t(i===0?"rowGood":"rowBad");
      host.appendChild(lab);
    }
    const b=document.createElement("button");
    b.type="button";
    b.className=`tile ${tile.tone==="neutral"&&tile.id==="new"?"new":tile.tone}`;
    b.disabled=counts[tile.id]===0&&activeTile!==tile.id;
    b.setAttribute("aria-pressed",activeTile===tile.id?"true":"false");
    const sub=tile.id==="new"?t("tNewSub"):tile.sub?t(tile.sub):"";
    b.innerHTML=`<span class="v">${counts[tile.id]}</span><span class="t"><span class="k">${esc(t(tile.key))}</span><span class="s">${esc(sub)}</span></span>`;
    b.addEventListener("click",()=>{activeTile=activeTile===tile.id?null:tile.id;render();});
    host.appendChild(b);
  });
  const names=new Set(pool.map(p=>p.university));
  const events=changeFeed.filter(e=>names.has(e.university)).sort((a,b)=>b.date.localeCompare(a.date));
  const shown=feedExpanded?events:events.slice(0,6);
  const ul=document.getElementById("feed");
  ul.innerHTML=shown.length?shown.map(e=>{
    const what=e.type==="added"?esc(t("evAdded")):`${esc(fieldLabel(e.field))}: ${esc(fieldValue(e.field,e.old))} → ${esc(fieldValue(e.field,e.new))}`;
    return `<li><time>${esc(e.date.slice(5))}</time><span class="what"><button type="button" class="uni" data-uni="${esc(e.university)}" title="${esc(t("feedSearch"))}">${esc(e.university)}</button> <span class="to ${esc(e.tone||"neutral")}">${what}</span></span></li>`;
  }).join(""):`<li class="feed-empty">${esc(t("feedEmpty"))}</li>`;
  ul.querySelectorAll(".uni").forEach(btn=>btn.addEventListener("click",()=>{
    document.getElementById("q").value=btn.dataset.uni;
    activeTile=null;
    render();
  }));
  const more=document.getElementById("feedMore");
  more.style.display=events.length>6?"inline":"none";
  more.textContent=feedExpanded?t("feedLess"):I18N[lang].feedMore(events.length);
}

function displayChangeEndpoint(chip,value){
  if(chip.type==="availability") return availabilityText(value);
  if(chip.type==="status") return statusText(value);
  return value||"—";
}

function renderChanges(p){
  const chips=changeChips(p);
  if(!chips.length) return `<span class="dim" title="${esc(t("noComparison"))}">—</span>`;
  return chips.map(chip=>{
    const text=`${t(chip.key)}${chip.arrow}`;
    const title=chip.key==="chgNew"?t("chgNew"):`${t("from")} ${displayChangeEndpoint(chip,chip.from)} ${t("to")} ${displayChangeEndpoint(chip,chip.to)}`;
    return `<span class="chg ${chip.key==="chgNew"?"new":chip.tone}" title="${esc(title)}">${esc(text)}</span>`;
  }).join("");
}

/** 勾/取消一个筛选值（侧栏的复选框就是真相，直接改它）。统计格、筛选标签的 × 都走这里。 */
function toggleFacet(key,value,on){
  const box=document.querySelector(`input[data-facet="${key}"][value="${CSS.escape(value)}"]`);
  if(!box) return;
  box.checked=on??!box.checked;
  render();
}
function renderSummary(rows){
  const counts={Green:0,Yellow:0,Red:0,Closed:0};
  for(const p of rows) if(Object.prototype.hasOwnProperty.call(counts,p.exchange_availability)) counts[p.exchange_availability]++;
  const on=(k,v)=>selectedValues(k).includes(v);
  const cells=[
    {cls:"total",v:rows.length,k:t("results")},
    {cls:"g",v:counts.Green,k:t("green"),facet:"exchange_availability",value:"Green"},
    {cls:"y",v:counts.Yellow,k:t("yellow"),facet:"exchange_availability",value:"Yellow"},
    {cls:"r",v:counts.Red,k:t("red"),facet:"exchange_availability",value:"Red"},
    {cls:"c",v:rows.filter(p=>p.open_closed==="Closed").length,k:t("closed"),facet:"open_closed",value:"Closed"}
  ];
  document.getElementById("summary").innerHTML=cells.map(c=>c.facet
    ?`<button type="button" class="stat ${c.cls}" data-facet="${c.facet}" data-value="${c.value}" aria-pressed="${on(c.facet,c.value)}"><span class="dot"></span><span class="v">${c.v}</span><span class="k">${esc(c.k)}</span></button>`
    :`<div class="stat ${c.cls}"><span class="v">${c.v}</span><span class="k">${esc(c.k)}</span></div>`).join("");
}
document.getElementById("summary").addEventListener("click",e=>{
  const b=e.target.closest("button[data-facet]");
  if(b) toggleFacet(b.dataset.facet,b.dataset.value);
});

/** 表格上方那排标签：现在生效的每个条件一个，带 × 可以单独去掉。 */
function renderActiveFilters(){
  const chips=[];
  const q=document.getElementById("q").value.trim();
  if(q) chips.push({label:q,kind:t("fchipSearch"),clear:()=>{document.getElementById("q").value="";render();}});
  for(const f of FACETS) for(const v of selectedValues(f.key))
    chips.push({label:translatedValue(f.key,v),kind:t(f.labelKey),clear:()=>toggleFacet(f.key,v,false)});
  const tile=TILES.find(x=>x.id===activeTile);
  if(tile) chips.push({label:t(tile.key),kind:t("fchipTile"),clear:()=>{activeTile=null;render();}});
  const host=document.getElementById("active");
  host.innerHTML=chips.map((c,i)=>`<span class="fchip"><i>${esc(c.kind)}</i><span>${esc(c.label)}</span><button type="button" data-chip="${i}" title="${esc(t("removeFilter"))}" aria-label="${esc(t("removeFilter"))}">×</button></span>`).join("");
  host._chips=chips;
  const fab=document.getElementById("fabCount");
  fab.hidden=chips.length===0; fab.textContent=chips.length;
}
document.getElementById("active").addEventListener("click",e=>{
  const b=e.target.closest("button[data-chip]");
  if(b) document.getElementById("active")._chips[+b.dataset.chip].clear();
});

/** 手机上的卡片，和表格同一批行、同一套单元格函数。 */
function cardHtml(p){
  const mismatch=(p.search_detail_mismatch||[]).length>0;
  const chg=renderChanges(p);
  return `<article class="pcard">
    <div class="pcard-head">
      <div><div class="name">${esc(p.university||"—")}${mismatch?` <span class="warn">⚠</span>`:""}</div>
      <div class="sub">${esc(p.country||"—")} · ${esc(asList(p.region).join(", ")||"—")}</div></div>
      <div class="qs"><span>QS</span><b>${renderQs(p)}</b></div>
    </div>
    <div class="pills"><span class="pill ${esc(p.open_closed||"")}">${esc(statusText(p.open_closed))}</span>${
      p.exchange_availability?`<span class="pill av-${esc(p.exchange_availability)}">${esc(availabilityText(p.exchange_availability))}</span>`:""}</div>
    <div class="facts">
      <div><b>${esc(t("cardMin"))}</b><span class="num">${esc(p.minimum_result_required||"—")}</span></div>
      <div><b>${esc(t("cardCutoff"))}</b><span class="num">${esc(p.previous_round_cutoff||"—")}</span></div>
      <div><b>${esc(t("cardPlaces"))}</b><span class="num">${esc(p.anticipated_places||"—")}</span></div>
    </div>
    <div class="chg-line">${/class="dim"/.test(chg)?"":chg}</div>
  </article>`;
}

function render(){
  let rows=programs.filter(p=>matchesProgram(p));
  rows.sort((a,b)=>sortValue(a,sortKey).localeCompare(sortValue(b,sortKey),undefined,{numeric:true})*sortDir);
  document.getElementById("metaLine").innerHTML=I18N[lang].meta(rows.length,programs.length);
  renderSummary(rows);
  renderPanel();
  updateFacetCounts();
  renderActiveFilters();
  document.querySelectorAll("th[data-key]").forEach(th=>{
    th.classList.toggle("sorted",th.dataset.key===sortKey);
    th.classList.toggle("asc",th.dataset.key===sortKey&&sortDir===1);
  });

  const tbody=document.getElementById("rows");
  tbody.innerHTML="";
  document.getElementById("empty").hidden=rows.length>0;
  rows.forEach(p=>{
    const tr=document.createElement("tr");
    const mismatch=(p.search_detail_mismatch||[]).length>0;
    const warning=mismatch?` <span class="warn" title="${esc(t("mismatch"))}: ${esc((p.search_detail_mismatch||[]).join(", "))}">⚠</span>`:"";
    tr.innerHTML=`
      <td class="stick">${esc(p.university||"—")}${warning}</td>
      <td>${esc(p.country||"—")}</td>
      <td class="num tight">${renderQs(p)}</td>
      <td class="small">${esc(asList(p.region).join(", ")||"—")}</td>
      <td class="mid tight"><span class="pill ${esc(p.open_closed||"")}">${esc(statusText(p.open_closed))}</span></td>
      <td class="mid tight">${p.exchange_availability?`<span class="pill av-${esc(p.exchange_availability)}">${esc(availabilityText(p.exchange_availability))}</span>`:""}</td>
      <td class="chg-cell">${renderChanges(p)}</td>
      <td class="num">${esc(p.minimum_result_required||"—")}</td>
      <td class="num">${esc(p.previous_round_cutoff||"—")}</td>
      <td class="num tight">${esc(p.anticipated_places||"—")}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("cards").innerHTML=rows.map(cardHtml).join("");
}

(function initPanel(){

  try{saved=localStorage.getItem(PANEL_KEY);}catch(e){}
  panel.open=saved===null?!window.matchMedia("(max-width:600px)").matches:saved==="1";

(function initTooltip(){
  const tip=document.getElementById("tip");
  let pinned=null;
  const place=(x,y)=>{
    const w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.max(8,Math.min(x+12,window.innerWidth-w-8))+"px";
    tip.style.top=(y+16+h>window.innerHeight?y-h-10:y+16)+"px";
  };
  const show=(el,x,y)=>{tip.textContent=el.dataset.tip;tip.style.display="block";place(x,y);};
  document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el&&!pinned) show(el,e.clientX,e.clientY);});
  document.addEventListener("mousemove",e=>{if(tip.style.display==="block"&&!pinned) place(e.clientX,e.clientY);});
  document.addEventListener("mouseout",e=>{const el=e.target.closest("[data-tip]");if(el&&!pinned&&!el.contains(e.relatedTarget)) tip.style.display="none";});
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-tip]");
    if(el){pinned=pinned===el?null:el; if(pinned) show(el,e.clientX,e.clientY); else tip.style.display="none";}
    else if(pinned){pinned=null;tip.style.display="none";}
  });
  window.addEventListener("scroll",()=>{if(!pinned) tip.style.display="none";},{passive:true});
})();
/* 主题、行距、手机抽屉：和正式版同一套 */
(function initTheme(){
  let theme=null;
  try{theme=localStorage.getItem("theme");}catch(e){}
  if(theme==="light"||theme==="dark") document.documentElement.dataset.theme=theme;
  document.getElementById("theme").addEventListener("click",()=>{
    const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    const next=dark?"light":"dark";
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem("theme",next);}catch(e){}
  });
})();
(function initDensity(){
  let density="comfortable";
  try{density=localStorage.getItem("density")||density;}catch(e){}
  const apply=()=>{
    document.body.dataset.density=density;
    document.querySelectorAll("#density button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.density===density)));
  };
  apply();
  document.getElementById("density").addEventListener("click",e=>{
    const b=e.target.closest("button[data-density]"); if(!b) return;
    density=b.dataset.density; try{localStorage.setItem("density",density);}catch(e){} apply();
  });
})();
(function initDrawer(){
  const open=on=>document.body.classList.toggle("filters-open",on);
  document.getElementById("fab").addEventListener("click",()=>open(true));
  document.querySelectorAll("[data-close-filters]").forEach(el=>el.addEventListener("click",()=>open(false)));
  document.addEventListener("keydown",e=>{if(e.key==="Escape") open(false);});
})();
document.getElementById("langEn").addEventListener("click",()=>applyLanguage("en"));
document.getElementById("langZh").addEventListener("click",()=>applyLanguage("zh"));
document.querySelectorAll("th[data-key]").forEach(th=>{
  th.addEventListener("click",()=>{
    const key=th.dataset.key;
    if(sortKey===key) sortDir*=-1; else {sortKey=key;sortDir=1;}
    render();
  });
});

async function fetchJson(path){
  const r=await fetch(path);
  if(!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

Promise.all([fetchJson("./data/current.json"),fetchJson("./data/comparison.json"),fetchJson("./data/changes.json").catch(()=>({events:[]}))])
  .then(([current,comparison,changes])=>{
    programs=current.programs||[];
    baselineByUniversity=comparison.by_university||{};
    baselineLoaded=true;
    changeFeed=changes.events||[];
    buildFacets();
    let initial="en";
    try{const saved=localStorage.getItem("demo.lang");if(saved==="zh"||saved==="en")initial=saved;}catch(e){}
    applyLanguage(initial);
  })
  .catch(err=>{
    document.getElementById("metaLine").textContent="Could not load demo data: "+err;
  });
</script>
